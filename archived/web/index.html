<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Meter · Usage Report</title>
  <style>
    :root{--ink:#20231f;--muted:#74786e;--paper:#f5f6f1;--card:#fff;--line:#e5e8df;--green:#2d7559;--green-soft:#d9eee4;--amber:#b6782b;--red:#b44f45;--blue:#4e79a7;--shadow:0 12px 36px #263d2b0e}
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);background:var(--paper);font:14px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}
    .app-shell{display:flex;min-height:100vh}
    .sidebar{width:64px;flex:none;background:#1f2822;color:#edf5ee;transition:width .2s ease;overflow:hidden;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:5}
    .app-shell.menu-open .sidebar{width:226px}
    .sidebar-top{height:76px;display:flex;align-items:center;gap:12px;padding:14px 12px;border-bottom:1px solid #ffffff18}
    .sidebar-toggle{width:38px;height:38px;border:0;border-radius:10px;color:#edf5ee;background:#ffffff12;font-size:20px;line-height:1}
    .sidebar-toggle:hover{background:#ffffff22}
    .side-nav{padding:16px 10px;display:grid;gap:7px}
    .nav-item{border:0;background:transparent;color:#b9c7bc;display:flex;align-items:center;gap:12px;width:100%;padding:11px 10px;border-radius:10px;text-align:left;font-weight:700;white-space:nowrap}
    .nav-item:hover{background:#ffffff12;color:#fff}
    .nav-item.active{background:#d9eee4;color:#1f5c43}
    .nav-icon{width:22px;text-align:center;font-size:17px;flex:none}
    .nav-label{opacity:0;transition:opacity .15s}
    .app-shell.menu-open .nav-label{opacity:1}
    .main-shell{min-width:0;flex:1}
    .topbar{min-height:76px;padding:14px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);background:#f8f9f5cc;backdrop-filter:blur(10px);position:sticky;top:0;z-index:4}
    .topbar-left{display:flex;align-items:center;gap:18px;min-width:0}
    .page-brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
    .page-brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#202923;color:#f4f6ef;font-size:11px;font-weight:900;letter-spacing:-.08em}
    .page-brand-name{font-size:14px;font-weight:900;letter-spacing:-.03em}
    .page-heading{min-width:0}
    .topbar h1{margin:0;font-size:22px;letter-spacing:-.035em}
    .topbar p{margin:3px 0 0;color:var(--muted);font-size:12px}
    .top-actions{display:flex;align-items:center;gap:12px;text-align:right}
    .account-badge strong{display:block;font-size:14px}
    .account-badge > span{color:var(--muted);font-size:11px}
    .account-badge .pill{color:var(--green);font-size:11px}
    .account-badge .provider-line{display:block;color:var(--muted);font-size:11px}
    .refresh{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 11px;font-weight:700}
    .refresh:hover{border-color:var(--green);color:var(--green)}
    .page-content{max-width:1520px;margin:auto;padding:28px 30px 60px}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px}
    .section-heading{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin:28px 0 12px}
    .section-heading h2{margin:0;font-size:18px;letter-spacing:-.02em}
    .section-heading p{margin:0;color:var(--muted);font-size:12px}
    .window-summary{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr);gap:16px}
    .window-main{min-height:190px}
    .eyebrow{margin:0;color:var(--green);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .window-title{display:flex;align-items:baseline;gap:12px;margin:9px 0 4px}
    .window-title h2{margin:0;font-size:26px;letter-spacing:-.04em}
    .pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:99px;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:800}
    .pill.warn{background:#f8e7e3;color:var(--red)}
    .window-range{color:var(--muted);font-size:12px}
    .window-range b{color:var(--ink)}
    .window-capacity-callout{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;padding:12px 14px;border:1px solid #cfe5d8;border-radius:12px;background:#f1faf5}
    .window-capacity-callout span{display:block;color:var(--green);font-size:11px;font-weight:900;letter-spacing:.04em}
    .window-capacity-callout strong{display:block;font-size:18px;white-space:nowrap}
    .window-capacity-callout small{display:block;color:var(--muted);font-size:10px;text-align:right}
    .window-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:20px}
    .stat-card{min-width:0}
    .stat-card strong{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stat-card span{display:block;color:var(--muted);font-size:11px}
    .stat-card small{display:block;color:var(--muted);font-size:10px;line-height:1.35;white-space:normal}
    .window-side{display:flex;flex-direction:column;justify-content:space-between;text-align:right}
    .window-side strong{font-size:17px}
    .window-side p{margin:5px 0;color:var(--muted);font-size:12px}
    .scope-tabs{display:flex;gap:8px;margin:24px 0 8px;border-bottom:1px solid var(--line)}
    .scope-tab{border:0;background:transparent;color:var(--muted);padding:10px 15px;border-bottom:2px solid transparent;font-weight:800}
    .scope-tab:hover{color:var(--ink)}
    .scope-tab.active{color:var(--ink);border-color:var(--green)}
    .split-overview{display:grid;grid-template-columns:minmax(510px,1.05fr) minmax(0,1.45fr);gap:16px}
    .calendar-panel{min-width:0}
    .calendar-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
    .calendar-head h3{margin:0;font-size:15px}
    .calendar-head span{color:var(--muted);font-size:11px}
    .calendar-legend{display:flex;justify-content:space-between;gap:10px;margin:-4px 0 11px;color:var(--muted);font-size:10px;white-space:nowrap}
    .weekday-row,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
    .weekday-row{margin-bottom:6px;color:var(--muted);font-size:10px;text-align:center}
    .calendar-grid .blank{min-height:112px}
    .day-cell{min-height:112px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fafbf8;text-align:left;color:var(--ink);transition:.15s}
    .day-cell:hover,.day-cell.selected{border-color:var(--green);transform:translateY(-1px);box-shadow:0 0 0 2px var(--green-soft)}
    .day-cell.no-data{background:#fafbf8;color:#a2a79e}
    .day-cell.tone-1{background:#edf7f0}.day-cell.tone-2{background:#d9eee0}.day-cell.tone-3{background:#b8dec8}.day-cell.tone-4{background:#8ec5a8;color:#143b2a}
    .day-cell .day-number{display:block;font-size:11px;color:var(--muted)}
    .day-cell strong{display:block;margin-top:6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .day-cell small{display:block;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .day-cell .day-token{color:var(--ink);font-weight:800}
    .day-cell .day-percent{margin-top:2px;color:var(--green);font-weight:800}
    .day-cell .day-missing{color:#a2a79e}
    .day-cell.tone-4 .day-number,.day-cell.tone-4 small{color:#2c644a}
    .chart-panel{min-width:0}
    .chart-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
    .chart-toolbar h3{margin:0;font-size:15px}
    .metric-picker{display:flex;gap:5px;flex-wrap:wrap}
    .metric-button{border:1px solid var(--line);background:#fafbf8;color:var(--muted);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:700}
    .metric-button.active{background:var(--green-soft);border-color:#a8d5bb;color:var(--green)}
    .chart-note{margin:0 0 7px;color:var(--muted);font-size:11px}
    .chart-legend{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 8px;color:var(--muted);font-size:10px}
    .chart-legend span{display:inline-flex;align-items:center;gap:5px}
    .chart-legend i{width:18px;height:3px;border-radius:99px;background:var(--green);display:inline-block}
    .chart-legend i.blue{background:var(--blue)}
    .chart-legend i.amber{background:var(--amber)}
    .chart-legend i.bar{height:9px;border-radius:3px;background:#80b99b}
    .line-chart{width:100%;height:280px;display:block}
    .line-chart .grid{stroke:#e7ebe3;stroke-width:1}
    .line-chart .axis-label{fill:#8a9185;font-size:10px}
    .line-chart .line{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .line-chart .line-secondary{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .line-chart .line-dashed{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:5 5;stroke-linecap:round}
    .line-chart .reset-marker{stroke:#b9c6bb;stroke-width:1.5;stroke-dasharray:4 4}
    .line-chart .point{fill:#fff;stroke:var(--green);stroke-width:2}
    .line-chart .point-secondary{fill:#fff;stroke:var(--blue);stroke-width:2}
    .line-chart .bar-local{fill:#80b99b;opacity:.85}
    .line-chart .bar-official{fill:#d4a05d;opacity:.75}
    .chart-empty{height:280px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:12px;text-align:center;padding:20px}
    .source-stack{display:grid;gap:8px}
    .source-row{display:grid;grid-template-columns:170px repeat(7,minmax(92px,1fr));gap:8px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fafbf8;overflow:auto}
    .source-name strong{display:block;font-size:12px}
    .source-name span{display:block;color:var(--muted);font-size:10px}
    .source-value{min-width:0}
    .source-value strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .source-value span{display:block;color:var(--muted);font-size:10px}
    .source-row.ccusage{background:#fbf8f2}
    .source-row.ccusage .source-name strong{color:var(--amber)}
    .detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
    .detail-panel h3{margin:0;font-size:15px}
    .detail-panel .panel-subtitle{margin:3px 0 10px;color:var(--muted);font-size:11px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}
    .table{border-collapse:collapse;width:100%;min-width:620px}
    .table th,.table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
    .table th{color:var(--muted);font-size:10px;font-weight:900;background:#fafbf8}
    .table tr:last-child td{border-bottom:0}
    .table .number{text-align:right;font-variant-numeric:tabular-nums}
    .empty-state{min-height:180px;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:20px}
    .details-toggle{margin-top:10px;border:0;background:transparent;color:var(--green);font-size:11px;font-weight:800;padding:0}
    .window-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
    .window-card{border:1px solid var(--line);border-radius:12px;background:#fafbf8;padding:13px;text-align:left;color:var(--ink)}
    .window-card:hover,.window-card.selected{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
    .window-card .window-date{font-weight:800;font-size:12px}
    .window-card .window-sub{color:var(--muted);font-size:10px;margin-top:3px}
    .window-card .window-values{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
    .window-card .window-values strong{display:block;font-size:13px}
    .window-card .window-values span{display:block;color:var(--muted);font-size:10px}
    .range-panel{display:grid;gap:12px}
    .dual-slider{position:relative;height:76px;margin:2px 10px 0}
    .range-track,.range-fill{position:absolute;left:0;right:0;top:35px;height:8px;border-radius:99px}
    .range-track{background:#e4e7e1;border:1px solid #c9cec5}
    .range-fill{background:var(--green)}
    .range-input{position:absolute;left:0;top:24px;width:100%;height:30px;margin:0;background:transparent;appearance:none;-webkit-appearance:none;pointer-events:none;accent-color:var(--green)}
    .range-input::-webkit-slider-runnable-track{height:8px;background:transparent}
    .range-input::-moz-range-track{height:8px;background:transparent}
    .range-input::-webkit-slider-thumb{width:22px;height:22px;margin-top:-7px;border:0;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px #d9eee4;appearance:none;-webkit-appearance:none;pointer-events:auto;cursor:grab}
    .range-input::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px #d9eee4;pointer-events:auto;cursor:grab}
    .range-input.range-end{z-index:4}
    .range-input.range-start{z-index:3}
    .range-bubble{position:absolute;top:0;transform:translateX(-50%);padding:3px 7px;border-radius:7px;background:#202923;color:#fff;font-size:10px;font-weight:800;white-space:nowrap;pointer-events:none}
    .range-bubble.start{background:var(--green)}
    .range-bubble.end{background:#4e79a7}
    .range-boundaries{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;font-weight:700}
    .capacity-chart{min-height:360px}
    .capacity-selection{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fafbf8}
    .capacity-selection strong{display:block;font-size:14px}
    .capacity-selection span{display:block;color:var(--muted);font-size:11px}
    .capacity-selection .refresh{white-space:nowrap}
    .capacity-estimate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
    .estimate-card{padding:11px 12px;border:1px solid #cfe5d8;border-radius:11px;background:#f1faf5}
    .estimate-card strong{display:block;font-size:16px}
    .estimate-card span{display:block;color:var(--muted);font-size:10px}
    .capacity-boundary-note{margin:8px 0 0;color:var(--amber);font-size:11px}
    .combined-chart-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
    .combined-chart-title h3{margin:0;font-size:15px}
    .combined-chart-title p{margin:0;color:var(--muted);font-size:11px}
    .capacity-legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 8px;color:var(--muted);font-size:11px}
    .capacity-legend span{display:inline-flex;align-items:center;gap:5px}
    .capacity-legend i{width:18px;height:3px;border-radius:99px;background:var(--green);display:inline-block}
    .capacity-legend i.blue{background:var(--blue)}
    .capacity-legend i.amber{background:var(--amber)}
    .combined-chart{width:100%;height:300px;display:block}
    .combined-chart .grid{stroke:#e7ebe3;stroke-width:1}
    .combined-chart .axis-label{fill:#8a9185;font-size:10px}
    .combined-chart .line{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .combined-chart .line-blue{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .combined-chart .point{fill:#fff;stroke:var(--green);stroke-width:2}
    .combined-chart .point-blue{fill:#fff;stroke:var(--blue);stroke-width:2}
    .capacity-comparison{margin-top:16px}
    .capacity-comparison h3{margin:0 0 8px;font-size:14px}
    .capacity-comparison .table{min-width:760px}
    .capacity-inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .capacity-input{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafbf8}
    .capacity-input label{display:block;font-weight:800;font-size:12px}
    .capacity-input input{width:100%;margin:9px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
    .method-copy{max-width:950px}
    .method-copy p{color:var(--muted);margin:8px 0}
    .method-copy h3{margin:24px 0 10px;font-size:15px}
    .muted{color:var(--muted)}
    .warn{color:var(--amber)}
    .ok{color:var(--green)}
    footer{margin-top:30px;border-top:1px solid var(--line);padding-top:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:11px}
    .loading{padding:100px;text-align:center;color:var(--muted)}
    .error{margin:30px;padding:18px;border:1px solid #ecc5be;border-radius:12px;background:#f8e7e3;color:#8e3d37}
    @media(max-width:1120px){.window-summary,.split-overview{grid-template-columns:1fr}.window-side{text-align:left;min-height:130px}.source-row{grid-template-columns:150px repeat(7,120px)}}
    .session-name strong{display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .session-name small{display:block;color:var(--muted);font-size:10px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media(max-width:820px){.topbar{padding:16px 18px}.page-content{padding:20px 18px 44px}.detail-grid{grid-template-columns:1fr}.capacity-inputs{grid-template-columns:1fr}.window-stats{grid-template-columns:repeat(2,1fr)}.top-actions .account-badge{display:none}.page-brand-name{font-size:13px}}
    @media(max-width:620px){.sidebar{width:54px}.sidebar-top{padding:12px 8px}.sidebar-toggle{width:36px}.app-shell.menu-open .sidebar{width:210px}.topbar{align-items:flex-start}.topbar h1{font-size:18px}.window-title h2{font-size:22px}.dual-slider{margin-left:2px;margin-right:2px}.calendar-grid .blank{min-height:64px}.day-cell{min-height:64px;padding:5px}.day-cell small{display:none}.line-chart{height:220px}.combined-chart{height:240px}.chart-empty{height:220px}}
  </style>

<body>
  <div id="app"><div class="loading">正在读取本机 JSONL…</div></div>
  <script>
  (function(){
    var app = document.getElementById('app');
    var report = null;
    var page = 'usage';
    var usageScope = 'day';
    var selectedDate = null;
    var selectedWindow = 0;
    var menuOpen = false;
    var dayMetric = 'token';
    var minuteMetric = 'token';
    var weekMetric = 'official';
    var capacityStart = 0;
    var capacityEnd = 0;
    var capacityRangeReady = false;
    var capacityEstimateVisible = false;

    function esc(value){
      return String(value == null ? '' : value).replace(/[&<>'"]/g,function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];
      });
    }
    function number(value){
      if(value == null || !Number.isFinite(Number(value))) return null;
      return Number(value);
    }
    function fmt(value,digits){
      var n=number(value);
      return n == null ? '—' : n.toLocaleString('zh-CN',{maximumFractionDigits:digits == null ? 2 : digits});
    }
    function compactNumber(value,digits){
      var n=number(value);
      if(n==null) return null;
      var abs=Math.abs(n),unit='',scale=1;
      if(abs>=1e12){unit='T';scale=1e12}else if(abs>=1e9){unit='B';scale=1e9}else if(abs>=1e6){unit='M';scale=1e6}else if(abs>=1e3){unit='K';scale=1e3}
      if(!unit) return Math.round(n).toLocaleString('zh-CN');
      var places=digits == null ? (abs>=1e8?1:abs>=1e6?1:2) : digits;
      return (n/scale).toLocaleString('zh-CN',{maximumFractionDigits:places})+unit;
    }
    function tokens(value){var n=number(value);return n==null?'待定':compactNumber(n)}
    function money(value){
      var n=number(value);
      if(n == null) return '<span class="warn">待定</span>';
      if(n !== 0 && Math.abs(n)<1) return '$<1';
      return '$'+Math.round(n).toLocaleString('zh-CN');
    }
    function creditText(value){var n=number(value);return n==null?'待定':compactNumber(n,1)}
    function creditValue(value){var n=number(value);return n==null?'<span class="warn">待补数据</span>':creditText(n)}
    function percent(value){var n=number(value);return n == null ? '待定' : fmt(n,0)+'%'}
    function percentPrecise(value){var n=number(value);return n == null ? '待定' : fmt(n,1)+'%'}
    function parseDateKey(key){
      if(!key) return null;
      var p=String(key).split('-').map(Number);
      if(p.length!==3 || p.some(function(v){return !Number.isFinite(v)})) return null;
      return new Date(p[0],p[1]-1,p[2]);
    }
    function dateKey(date){
      if(!date) return null;
      return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
    }
    function shiftDate(key,days){
      var date=parseDateKey(key)||new Date();
      date.setDate(date.getDate()+days);
      return dateKey(date);
    }
    function dateLabel(key,withYear){
      if(!key) return '待补数据';
      return withYear ? String(key).replace('-','/').replace('-','/') : key.slice(5).replace('-','/');
    }
    function dateTime(ms){

      var width=860,height=320,pad={left:52,right:62,top:42,bottom:36},plotHeight=height-pad.top-pad.bottom;
      var x=function(index){return pad.left+index*(width-pad.left-pad.right)/Math.max(days.length-1,1)},yPercent=function(value){return height-pad.bottom-Math.max(0,Math.min(100,Number(value)))*plotHeight/100},yCredit=function(value){return height-pad.bottom-Number(value)*plotHeight/maxCredit};
      var legend='<div class="capacity-legend"><span><i></i>官方剩余%</span><span><i class="blue"></i>官方累计已用%</span><span><i class="amber"></i>本机累计周占比</span><span><i class="blue"></i>本机累计 Credit（右轴）</span></div>';
      var html='<div class="combined-chart-title"><h3>窗口使用图表</h3><p>左轴百分比 · 右轴本机 Credit；Reset 处累计重新开始</p></div>'+legend;
      if(!valid) return html+'<div class="chart-empty">暂无可绘制数据<br><span>官方百分比、本机 Credit 或每日套餐额度待补</span></div>';
      html+='<svg class="combined-chart" viewBox="0 0 '+width+' '+height+'" role="img" aria-label="官方百分比、本机周占比与 Credit 双轴图">';
      [100,50,0].forEach(function(value){var gy=yPercent(value);html+='<line class="grid" x1="'+pad.left+'" y1="'+gy+'" x2="'+(width-pad.right)+'" y2="'+gy+'"></line><text class="axis-label" x="5" y="'+(gy+4)+'">'+value+'%</text><text class="axis-label" text-anchor="end" x="'+(width-5)+'" y="'+(gy+4)+'">'+esc(creditText(maxCredit*(value/100)))+'</text>'});
      resetIndices(days).forEach(function(index){html+='<line class="reset-marker" x1="'+x(index)+'" y1="'+pad.top+'" x2="'+x(index)+'" y2="'+(height-pad.bottom)+'"></line>'});
      var boundaries=resetIndices(days);
      seriesChunks(remaining,x,yPercent,boundaries).forEach(function(points){html+='<polyline class="line" points="'+points+'"></polyline>'});
      seriesChunks(officialCum,x,yPercent,boundaries).forEach(function(points){html+='<polyline class="line-secondary" points="'+points+'"></polyline>'});
      seriesChunks(localShare,x,yPercent,boundaries).forEach(function(points){html+='<polyline class="line-dashed" points="'+points+'"></polyline>'});
      seriesChunks(credits,x,yCredit,boundaries).forEach(function(points){html+='<polyline class="line-blue" points="'+points+'"></polyline>'});
      remaining.forEach(function(value,index){if(number(value)!=null)html+='<circle class="point" cx="'+x(index)+'" cy="'+yPercent(value)+'" r="3"></circle>'});
      credits.forEach(function(value,index){if(number(value)!=null)html+='<circle class="point-blue" cx="'+x(index)+'" cy="'+yCredit(value)+'" r="3"></circle>'});
      [0,Math.floor((labels.length-1)/2),labels.length-1].filter(function(value,index,all){return labels[value]!=null && all.indexOf(value)===index}).forEach(function(index){html+='<text class="axis-label" text-anchor="'+(index===0?'start':index===labels.length-1?'end':'middle')+'" x="'+x(index)+'" y="'+(height-8)+'">'+esc(labels[index])+'</text>'});
      return html+'</svg>';
    }
    function capacityComparisonTable(days){
      if(!days.length) return '';
      return '<details class="panel capacity-comparison"><summary class="details-toggle">展开区间对比明细</summary><div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th class="number">官方剩余</th><th class="number">官方日变化</th><th class="number">本机日 Token</th><th class="number">本机日 Credit</th><th class="number">本机 API 美元</th></tr></thead><tbody>'+days.map(function(day){var token=number(day.usage && day.usage.total),credit=number(day.credit),api=number(day.api_usd);return '<tr><td>'+esc(day.date)+'</td><td class="number">'+(number(day.official_percent_end)!=null?percent(100-number(day.official_percent_end)):'—')+'</td><td class="number">'+(officialDailyPercent(day)!=null?percent(officialDailyPercent(day)):'—')+'</td><td class="number">'+tokens(token)+'</td><td class="number">'+creditText(credit)+'</td><td class="number">'+(number(api)!=null?money(api):'—')+'</td></tr>'}).join('')+'</tbody></table></div></details>';
    }
    function capacityWindowsDetails(){
      var windows=displayWindows();
      if(!windows.length) return '<div class="empty-state">暂无 Reset 窗口证据</div>';
      return '<details class="panel"><summary class="details-toggle">展开 Reset 窗口明细</summary><div class="table-wrap"><table class="table"><thead><tr><th>窗口</th><th>Reset</th><th class="number">官方变化</th><th class="number">本机 Token</th><th class="number">本机 Credit</th><th>共享</th></tr></thead><tbody>'+windows.map(function(win){return '<tr><td>'+esc(win.limit || win.window_kind || '窗口')+'</td><td>'+dateTime(win.reset_at_ms)+'</td><td class="number">'+percent(win.percent_delta)+'</td><td class="number">'+tokens(win.local_tokens)+'</td><td class="number">'+creditText(win.local_credit)+'</td><td>'+((win.shared==null)?'待确认':win.shared?'是':'否')+'</td></tr>'}).join('')+'</tbody></table></div></details>';
    }
    function capacityInput(code,label){
      var existing=(report.capacities || []).find(function(value){return value.plan_code===code && value.status==='confirmed'});
      return '<div class="capacity-input"><label for="capacity-'+code+'">'+label+'</label><input id="capacity-'+code+'" type="number" min="0" step="0.01" placeholder="Credit" value="'+(existing && existing.credit != null ? esc(existing.credit) : '')+'"><button class="refresh" data-save-capacity="'+code+'">保存确认值</button></div>';
    }
    function capacitySelectionPanel(days,start,end){
      var blocked=capacityRangeBlocked(days),selected=days.slice(capacityStart,capacityEnd+1);
      return '<div class="capacity-selection"><div><strong>'+esc(start && end ? start.date+' → '+end.date : '待补数据')+'</strong><span>'+(blocked?'区间跨越 Reset，不能用于估算':'选中区间必须位于同一个 Reset 窗口；图表可显示跨窗口历史')+'</span></div><button class="refresh" data-auto-estimate '+(blocked || selected.length<2?'disabled':'')+'>自动估算建议值</button></div>';
    }
    function capacityEstimatePanel(days){
      if(!capacityEstimateVisible) return '';
      var result=capacityEstimate(days);
      if(!result) return '<div class="capacity-estimate"><div class="estimate-card"><strong class="warn">待补数据</strong><span>没有满足同一 Reset、官方变化至少 5% 的有效区间</span></div></div>';
      var best=result.best;
      return '<div class="capacity-estimate"><div class="estimate-card"><strong>'+creditText(best.value)+' Credit</strong><span>建议容量（最大有效候选）</span></div><div class="estimate-card"><strong>'+creditText(result.max)+' Credit</strong><span>最大候选</span></div><div class="estimate-card"><strong>'+fmt(result.count,0)+'</strong><span>有效滑动区间</span></div><div class="estimate-card"><strong>'+esc(days[best.start].date)+' → '+esc(days[best.end].date)+'</strong><span>官方变化 '+percent(best.official)+' · 本机 Credit '+creditText(best.credit)+'</span></div></div>';
    }
    function capacityPage(){
      ensureCapacityRange();
      var days=sortedDays(),start=days[capacityStart],end=days[capacityEnd];
      var selectedDays=days.slice(capacityStart,capacityEnd+1);
      return '<main class="page-content"><div class="section-heading"><h2>容量估算时间范围</h2><p>默认最近 30 天；拖动两个端点选择图表区间</p></div><section class="panel range-panel">'+dualRangeControl(days)+'</section><div class="section-heading"><h2>窗口使用图表</h2><p>'+esc(start && end ? start.date+' → '+end.date : '待补数据')+'</p></div><section class="panel capacity-chart">'+combinedCapacityChart(selectedDays)+capacitySelectionPanel(days,start,end)+capacityEstimatePanel(selectedDays)+capacityComparisonTable(selectedDays)+'</section><div class="section-heading"><h2>人工确认值</h2><p>保存后作为 20 / 100 / 200 档位的确认容量</p></div><section class="capacity-inputs">'+capacityInput('usd20','20 美元档')+capacityInput('usd100','100 美元档')+capacityInput('usd200','200 美元档')+'</section>'+capacityWindowsDetails()+'<p id="capacity-status" class="muted"></p></main>';
    }
    function methodPage(){
      var methodology=report.methodology || {},card=methodology.price_card || [];
      return '<main class="page-content"><section class="panel method-copy"><h2>计算说明</h2><p>Token 先按 JSONL 的 last usage / cumulative 差分归一化；重复 cumulative 不重复计入，回退视为 reset。</p><p>Credit 和 API 等价美元使用事件发生时的静态价格卡，缓存读、缓存写、非缓存输入和输出分别计价；未知模型或 Fast 状态保持待定，不填 0。</p><p>JSONL 是本机主事实，App Server 只提供当前账号/官方窗口/账号日 Token，ccusage 只作为独立验证。</p><h3>当前静态价格卡 · '+esc(methodology.pricing_version || '待补数据')+'</h3><div class="table-wrap"><table class="table"><thead><tr><th>模型</th><th class="number">订阅输入 / M</th><th class="number">API 输入 / M</th><th class="number">Fast 倍率</th><th>生效</th></tr></thead><tbody>'+card.map(function(row){return '<tr><td>'+esc(row.model)+'</td><td class="number">$'+fmt(row.subscription_input,4)+'</td><td class="number">$'+fmt(row.api_input,4)+'</td><td class="number">'+fmt(row.fast_multiplier,2)+'×</td><td>'+dateTime(row.effective_from_ms)+'</td></tr>'}).join('')+'</tbody></table></div></section></main>';
    }
    async function get(path,options){
      var response=await fetch(path,options);
      if(!response.ok) throw new Error(await response.text());
      return response.json();
    }
    async function load(date){
      report=await get('/api/report'+(date?'?date='+encodeURIComponent(date):''));
      selectedDate=report.selected_day && report.selected_day.date || date || latestDate();
      ensureCapacityRange();
      render();
    }
    async function saveCapacity(code){
      var input=document.getElementById('capacity-'+code),value=Number(input && input.value);
      var status=document.getElementById('capacity-status');
      if(!Number.isFinite(value) || value<0){if(status) status.textContent='请输入非负 Credit 数值';return}
      try{
        await get('/api/capacities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan_code:code,credit:value,status:'confirmed'})});
        if(status) status.textContent='已保存 '+code+'：'+creditText(value)+' Credit';
        await load(selectedDate);
      }catch(error){if(status) status.textContent='保存失败：'+error.message}
    }
    function bind(){
      document.querySelectorAll('[data-page]').forEach(function(element){element.addEventListener('click',function(){page=element.dataset.page;render()})});
      document.getElementById('menu-toggle') && document.getElementById('menu-toggle').addEventListener('click',function(){menuOpen=!menuOpen;render()});
      document.querySelectorAll('[data-scope]').forEach(function(element){element.addEventListener('click',function(){usageScope=element.dataset.scope;render()})});
      document.querySelectorAll('[data-date]').forEach(function(element){element.addEventListener('click',function(){selectedDate=element.dataset.date;load(selectedDate)})});
      document.querySelectorAll('[data-chart-date]').forEach(function(element){element.addEventListener('click',function(){selectedDate=element.dataset.chartDate;load(selectedDate)})});
      document.querySelectorAll('[data-window-select]').forEach(function(element){element.addEventListener('click',function(){selectedWindow=Number(element.dataset.windowSelect);render()})});
      document.querySelectorAll('[data-metric-scope]').forEach(function(element){element.addEventListener('click',function(){var scope=element.dataset.metricScope,metric=element.dataset.metric;if(scope==='day') dayMetric=metric;if(scope==='minute') minuteMetric=metric;if(scope==='week') weekMetric=metric;render()})});
      var start=document.getElementById('capacity-start'),end=document.getElementById('capacity-end');
      var capacityDays=sortedDays();
      if(start) start.addEventListener('input',function(){capacityStart=Math.min(Number(start.value),capacityEnd);keepCapacityRangeInReset(capacityDays,'start');render()});
      if(end) end.addEventListener('input',function(){capacityEnd=Math.max(Number(end.value),capacityStart);keepCapacityRangeInReset(capacityDays,'end');render()});
      document.querySelectorAll('[data-auto-estimate]').forEach(function(element){element.addEventListener('click',function(){if(element.disabled)return;capacityEstimateVisible=true;render()})});
      document.querySelectorAll('[data-save-capacity]').forEach(function(element){element.addEventListener('click',function(){saveCapacity(element.dataset.saveCapacity)})});
      var refresh=document.getElementById('refresh');
      if(refresh) refresh.addEventListener('click',async function(){refresh.textContent='刷新中…';try{await get('/api/refresh',{method:'POST'});await load(selectedDate)}catch(error){showError(error)}});
    }
    function render(){
      if(!report) return;
      app.innerHTML='<div class="app-shell '+(menuOpen?'menu-open':'')+'">'+sidebar()+'<div class="main-shell">'+topbar()+(page==='usage'?usagePage():page==='capacity'?capacityPage():methodPage())+'</div></div>';
      bind();
    }
    function showError(error){
      app.innerHTML='<div class="error">读取失败：'+esc(error && error.message || error)+'<br><button class="refresh" onclick="location.reload()">重试</button></div>';
    }
    load().catch(showError);
  })();
  </script>
</body>
</html>
